<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncBoard | P2P Ecosystem</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <!-- QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(17, 24, 39, 0.7);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden; /* Prevent body scroll, handle inside containers */
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Animated Background */
        .bg-gradient-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.4), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(37, 99, 235, 0.4), transparent 25%);
            z-index: -1;
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        /* File Drop Zone Animation */
        .drag-active {
            border-color: #8b5cf6 !important;
            background: rgba(139, 92, 246, 0.1) !important;
            transform: scale(1.02);
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-screen flex flex-col relative">

    <!-- Dynamic Background -->
    <div class="bg-gradient-mesh"></div>

    <!-- Navbar -->
    <nav class="h-16 border-b border-white/5 bg-black/20 backdrop-blur-md flex items-center justify-between px-4 z-20 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-purple-500/20">
                <i class="fa-solid fa-infinity text-white text-sm"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-none tracking-tight">SyncBoard</h1>
                <div class="flex items-center gap-2 mt-0.5">
                    <div id="status-dot" class="w-1.5 h-1.5 rounded-full bg-yellow-500 animate-pulse"></div>
                    <span id="status-text" class="text-[10px] font-medium text-slate-400 uppercase tracking-wider">Initializing...</span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Mobile Tabs Toggle (Hidden on Desktop) -->
            <div class="flex md:hidden bg-white/5 rounded-lg p-1 border border-white/5 mr-2">
                <button id="tab-text" class="px-3 py-1.5 rounded-md text-xs font-medium bg-white/10 text-white transition-all">Text</button>
                <button id="tab-files" class="px-3 py-1.5 rounded-md text-xs font-medium text-slate-400 hover:text-white transition-all">Files</button>
            </div>

            <button id="join-btn" class="glass-button text-slate-300 px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-2">
                <i class="fa-solid fa-link"></i> <span class="hidden sm:inline">Join</span>
            </button>
            <button id="share-btn" class="hidden bg-white text-black hover:bg-slate-200 px-4 py-2 rounded-lg text-xs font-bold transition shadow-lg shadow-white/10 flex items-center gap-2">
                <i class="fa-solid fa-qrcode"></i> <span class="hidden sm:inline">Connect</span>
            </button>
        </div>
    </nav>

    <!-- Main Workspace -->
    <main class="flex-1 flex overflow-hidden relative z-10">
        
        <!-- Left Panel: Text Editor -->
        <section id="panel-text" class="flex-1 flex flex-col p-4 md:p-6 transition-all duration-300 absolute inset-0 md:relative md:translate-x-0 z-10 bg-black/0">
            <div class="glass-panel flex-1 rounded-2xl flex flex-col overflow-hidden shadow-2xl relative group">
                <!-- Toolbar -->
                <div class="h-10 border-b border-white/5 flex items-center justify-between px-4 bg-white/[0.02]">
                    <span class="text-xs font-mono text-slate-500">PLAIN TEXT</span>
                    <div class="flex gap-2">
                        <button id="clear-btn" class="text-slate-500 hover:text-red-400 transition text-xs" title="Clear"><i class="fa-solid fa-trash"></i></button>
                        <button id="copy-btn" class="text-slate-500 hover:text-indigo-400 transition text-xs" title="Copy"><i class="fa-solid fa-copy"></i></button>
                    </div>
                </div>
                
                <textarea 
                    id="clipboard-area" 
                    class="flex-1 bg-transparent text-slate-200 p-6 text-base md:text-lg resize-none outline-none font-mono leading-relaxed placeholder-slate-700"
                    placeholder="Type or paste text here to sync..."
                    spellcheck="false"
                ></textarea>

                <!-- Status Footer -->
                <div class="h-8 border-t border-white/5 flex items-center px-4 bg-black/20 text-[10px] text-slate-500 font-mono justify-between">
                    <span id="char-count">0 chars</span>
                    <span id="last-sync">Synced: Never</span>
                </div>
            </div>
        </section>

        <!-- Right Panel: File Transfer -->
        <section id="panel-files" class="flex-1 flex flex-col p-4 md:p-6 transition-all duration-300 absolute inset-0 translate-x-full md:relative md:translate-x-0 z-10 bg-black/0 md:border-l md:border-white/5">
            <div class="h-full flex flex-col gap-4">
                
                <!-- Drop Zone -->
                <div id="drop-zone" class="h-48 glass-panel rounded-2xl border-dashed border-2 border-white/10 flex flex-col items-center justify-center text-center cursor-pointer hover:border-indigo-500/50 hover:bg-indigo-500/5 transition-all group relative overflow-hidden">
                    <input type="file" id="file-input" class="absolute inset-0 opacity-0 cursor-pointer z-20">
                    <div class="z-10 pointer-events-none transform group-hover:scale-110 transition-transform duration-300">
                        <div class="w-12 h-12 rounded-full bg-white/5 flex items-center justify-center mx-auto mb-3 border border-white/10 group-hover:border-indigo-500/50">
                            <i class="fa-solid fa-cloud-arrow-up text-slate-400 group-hover:text-indigo-400 text-xl"></i>
                        </div>
                        <h3 class="text-sm font-semibold text-slate-200">Drop files to send</h3>
                        <p class="text-xs text-slate-500 mt-1">or click to browse</p>
                    </div>
                </div>

                <!-- File List -->
                <div class="flex-1 glass-panel rounded-2xl flex flex-col overflow-hidden">
                    <div class="h-10 border-b border-white/5 flex items-center px-4 bg-white/[0.02]">
                        <span class="text-xs font-mono text-slate-500">TRANSFER HISTORY</span>
                    </div>
                    <div id="file-list" class="flex-1 overflow-y-auto p-2 space-y-2">
                        <!-- Empty State -->
                        <div id="empty-files" class="h-full flex flex-col items-center justify-center text-slate-600 opacity-50">
                            <i class="fa-solid fa-box-open text-2xl mb-2"></i>
                            <span class="text-xs">No files shared yet</span>
                        </div>
                        <!-- File items will be injected here -->
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- Footer Stats -->
    <footer class="h-8 bg-black/40 border-t border-white/5 flex items-center justify-between px-4 text-[10px] text-slate-500 shrink-0 relative z-20">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-shield-halved text-emerald-500/80"></i>
            <span>End-to-End Encrypted via WebRTC</span>
        </div>
        <div id="peer-count">
            <i class="fa-solid fa-user-group mr-1"></i> 1 Device
        </div>
    </footer>

    <!-- Modals (QR & Join) -->
    <div id="modal-overlay" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center">
        
        <!-- QR Modal -->
        <div id="qr-content" class="glass-panel p-6 rounded-2xl w-full max-w-sm mx-4 transform scale-95 transition-transform duration-300 hidden">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-lg">Connect Device</h3>
                <button class="close-modal text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="bg-white p-4 rounded-xl flex justify-center mb-6">
                <div id="qrcode"></div>
            </div>
            <div class="bg-black/40 p-3 rounded-lg border border-white/10 flex items-center gap-2">
                <input type="text" id="host-id-display" class="bg-transparent text-slate-300 text-xs w-full font-mono outline-none" readonly>
                <button id="copy-id-btn" class="text-indigo-400 hover:text-indigo-300 text-[10px] font-bold uppercase tracking-wider">Copy</button>
            </div>
        </div>

        <!-- Join Modal -->
        <div id="join-content" class="glass-panel p-6 rounded-2xl w-full max-w-sm mx-4 transform scale-95 transition-transform duration-300 hidden">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-lg">Join Session</h3>
                <button class="close-modal text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <input type="text" id="manual-host-id" class="w-full bg-black/40 border border-white/10 text-white p-4 rounded-xl outline-none focus:border-indigo-500/50 mb-4 font-mono text-sm placeholder-slate-600 transition-colors" placeholder="Paste Session ID...">
            <button id="confirm-join-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold transition shadow-lg shadow-indigo-600/20">Connect</button>
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-12 left-1/2 transform -translate-x-1/2 md:translate-x-0 md:left-auto md:right-6 bg-slate-800 border border-white/10 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 translate-y-20 opacity-0 transition-all duration-300 z-50 min-w-[300px]">
        <div class="w-8 h-8 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0">
            <i id="toast-icon" class="fa-solid fa-bell"></i>
        </div>
        <div>
            <h4 id="toast-title" class="font-bold text-xs">Notification</h4>
            <p id="toast-msg" class="text-xs text-slate-400">Message goes here</p>
        </div>
    </div>

    <script>
        // --- UI & State Variables ---
        const dom = {
            text: document.getElementById('clipboard-area'),
            statusText: document.getElementById('status-text'),
            statusDot: document.getElementById('status-dot'),
            peerCount: document.getElementById('peer-count'),
            charCount: document.getElementById('char-count'),
            lastSync: document.getElementById('last-sync'),
            fileList: document.getElementById('file-list'),
            dropZone: document.getElementById('drop-zone'),
            fileInput: document.getElementById('file-input'),
            emptyFiles: document.getElementById('empty-files'),
            tabs: {
                text: document.getElementById('tab-text'),
                files: document.getElementById('tab-files'),
                panelText: document.getElementById('panel-text'),
                panelFiles: document.getElementById('panel-files')
            },
            modal: {
                overlay: document.getElementById('modal-overlay'),
                qr: document.getElementById('qr-content'),
                join: document.getElementById('join-content')
            }
        };

        const state = {
            peer: null,
            myId: null,
            conns: [],
            isHost: false,
            isInternalUpdate: false,
            filesReceived: {} // Track received blobs
        };

        // --- Initialization ---
        
        const urlParams = new URLSearchParams(window.location.search);
        const hostIdParam = urlParams.get('host');
        state.isHost = !hostIdParam;

        function init() {
            state.peer = new Peer(null, { debug: 1 });

            state.peer.on('open', (id) => {
                state.myId = id;
                console.log('My ID:', id);
                
                if (state.isHost) {
                    setStatus('active', 'Host Active');
                    document.getElementById('share-btn').classList.remove('hidden');
                    updateUrl(id);
                } else {
                    setStatus('pending', 'Connecting...');
                    document.getElementById('join-btn').classList.add('hidden');
                    connectToHost(hostIdParam);
                }
            });

            state.peer.on('connection', handleConnection);
            
            state.peer.on('error', (err) => {
                console.error(err);
                if(err.type === 'peer-unavailable') {
                    showToast('error', 'Connection Failed', 'Host not found or offline');
                    setStatus('error', 'Host Offline');
                }
            });

            // UI Listeners
            setupUIListeners();
        }

        // --- Networking Logic ---

        function connectToHost(id) {
            if(!id) return;
            // Close existing
            state.conns.forEach(c => c.close());
            state.conns = [];

            const conn = state.peer.connect(id);
            setupConnectionEvents(conn);
        }

        function handleConnection(conn) {
            setupConnectionEvents(conn);
        }

        function setupConnectionEvents(conn) {
            conn.on('open', () => {
                state.conns.push(conn);
                updatePeerCount();
                setStatus('active', 'Connected');
                
                if (state.isHost) {
                    // Send initial state
                    conn.send({ type: 'sync-text', content: dom.text.value });
                } else {
                    conn.send({ type: 'request-sync' });
                    // Disable join button if successfully connected
                    document.getElementById('join-btn').classList.add('hidden');
                }
            });

            conn.on('data', (data) => handleData(data, conn));

            conn.on('close', () => {
                state.conns = state.conns.filter(c => c !== conn);
                updatePeerCount();
                if (state.conns.length === 0 && !state.isHost) {
                    setStatus('error', 'Disconnected');
                    showToast('error', 'Disconnected', 'Lost connection to host');
                }
            });
        }

        function handleData(data, senderConn) {
            switch(data.type) {
                case 'sync-text':
                    if (dom.text.value !== data.content) {
                        state.isInternalUpdate = true;
                        dom.text.value = data.content;
                        updateTextStats();
                        state.isInternalUpdate = false;
                        highlightUpdate();
                    }
                    if (state.isHost) broadcast(data, senderConn);
                    break;
                
                case 'request-sync':
                    if (state.isHost) senderConn.send({ type: 'sync-text', content: dom.text.value });
                    break;

                case 'file-meta':
                    // Prepare to receive file
                    addFileToUI(data.meta, 'receiving');
                    break;

                case 'file-chunk':
                    // Receive actual file data
                    handleReceivedFile(data.meta, data.blob);
                    if (state.isHost) broadcast(data, senderConn); // Host relays files too
                    break;
            }
        }

        function broadcast(data, excludeConn) {
            state.conns.forEach(c => {
                if (c !== excludeConn && c.open) c.send(data);
            });
        }

        // --- File Handling ---

        function sendFile(file) {
            const meta = {
                id: crypto.randomUUID(),
                name: file.name,
                size: file.size,
                type: file.type,
                timestamp: Date.now()
            };

            // Add to own UI
            addFileToUI(meta, 'sent');
            showToast('info', 'Sending File...', file.name);

            // Send Meta first
            broadcast({ type: 'file-meta', meta: meta });

            // Send Data (PeerJS handles binary blobs)
            // Note: Large files might need chunking, keeping it simple for <10MB for stability in this demo
            const blob = new Blob([file], { type: file.type });
            broadcast({ type: 'file-chunk', meta: meta, blob: blob });
        }

        function handleReceivedFile(meta, blob) {
            const receivedBlob = new Blob([blob], { type: meta.type });
            const url = URL.createObjectURL(receivedBlob);
            
            updateFileUI(meta.id, url);
            showToast('success', 'File Received', meta.name);
        }

        // --- UI Logic ---

        function setupUIListeners() {
            // Text Sync
            dom.text.addEventListener('input', () => {
                if(state.isInternalUpdate) return;
                const content = dom.text.value;
                updateTextStats();
                
                const msg = { type: 'sync-text', content: content };
                if (state.isHost) broadcast(msg);
                else state.conns.forEach(c => c.send(msg));
            });

            // Buttons
            document.getElementById('copy-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(dom.text.value);
                showToast('success', 'Copied', 'Text copied to clipboard');
            });

            document.getElementById('clear-btn').addEventListener('click', () => {
                dom.text.value = '';
                dom.text.dispatchEvent(new Event('input'));
            });

            // File Drag & Drop
            dom.dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dom.dropZone.classList.add('drag-active');
            });
            dom.dropZone.addEventListener('dragleave', () => dom.dropZone.classList.remove('drag-active'));
            dom.dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dom.dropZone.classList.remove('drag-active');
                if (e.dataTransfer.files.length) sendFile(e.dataTransfer.files[0]);
            });
            dom.fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) sendFile(e.target.files[0]);
            });

            // Tabs (Mobile)
            dom.tabs.text.addEventListener('click', () => switchTab('text'));
            dom.tabs.files.addEventListener('click', () => switchTab('files'));

            // Modals
            document.getElementById('share-btn').addEventListener('click', openQR);
            document.getElementById('join-btn').addEventListener('click', () => openModal('join'));
            document.querySelectorAll('.close-modal').forEach(b => b.addEventListener('click', closeModal));
            dom.modal.overlay.addEventListener('click', (e) => {
                if (e.target === dom.modal.overlay) closeModal();
            });

            document.getElementById('confirm-join-btn').addEventListener('click', () => {
                const id = document.getElementById('manual-host-id').value.trim();
                if(id) {
                    state.isHost = false;
                    closeModal();
                    connectToHost(id);
                }
            });
        }

        function switchTab(tab) {
            if (tab === 'text') {
                dom.tabs.text.className = "px-3 py-1.5 rounded-md text-xs font-medium bg-white/10 text-white transition-all";
                dom.tabs.files.className = "px-3 py-1.5 rounded-md text-xs font-medium text-slate-400 hover:text-white transition-all";
                dom.tabs.panelText.classList.remove('-translate-x-full', 'opacity-0');
                dom.tabs.panelFiles.classList.add('translate-x-full');
            } else {
                dom.tabs.files.className = "px-3 py-1.5 rounded-md text-xs font-medium bg-white/10 text-white transition-all";
                dom.tabs.text.className = "px-3 py-1.5 rounded-md text-xs font-medium text-slate-400 hover:text-white transition-all";
                dom.tabs.panelText.classList.add('-translate-x-full', 'opacity-0');
                dom.tabs.panelFiles.classList.remove('translate-x-full');
            }
        }

        // --- Renderers ---

        function addFileToUI(meta, status) {
            dom.emptyFiles.style.display = 'none';
            
            const div = document.createElement('div');
            div.id = `file-${meta.id}`;
            div.className = "slide-up bg-white/5 border border-white/5 rounded-xl p-3 flex items-center gap-3 group hover:bg-white/10 transition-colors";
            
            const iconClass = meta.type.includes('image') ? 'fa-image text-purple-400' : 
                              meta.type.includes('pdf') ? 'fa-file-pdf text-red-400' : 'fa-file text-blue-400';

            div.innerHTML = `
                <div class="w-10 h-10 rounded-lg bg-black/20 flex items-center justify-center shrink-0">
                    <i class="fa-solid ${iconClass} text-lg"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-start">
                        <h4 class="text-sm font-medium truncate pr-2 text-slate-200">${meta.name}</h4>
                        <span class="text-[10px] text-slate-500 font-mono shrink-0">${formatBytes(meta.size)}</span>
                    </div>
                    <div class="flex items-center justify-between mt-1">
                        <span class="status-badge text-[10px] uppercase font-bold tracking-wider ${status === 'sent' ? 'text-emerald-400' : 'text-yellow-400'}">
                            ${status === 'sent' ? 'Sent' : 'Receiving...'}
                        </span>
                        <a href="#" class="download-link hidden text-xs bg-white text-black px-2 py-1 rounded font-bold hover:bg-slate-200 transition">Download</a>
                    </div>
                </div>
            `;
            
            dom.fileList.prepend(div);
        }

        function updateFileUI(id, url) {
            const el = document.getElementById(`file-${id}`);
            if (el) {
                const badge = el.querySelector('.status-badge');
                const link = el.querySelector('.download-link');
                
                badge.innerText = "Received";
                badge.className = "status-badge text-[10px] uppercase font-bold tracking-wider text-emerald-400";
                
                link.href = url;
                link.download = ""; // Use original name from logic if tracked, currently just reliable download
                link.classList.remove('hidden');
            }
        }

        function openQR() {
            // Generate link manually
            const baseUrl = window.location.href.split('?')[0];
            const link = `${baseUrl}?host=${state.myId}`;
            
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById('qrcode'), {
                text: link,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff"
            });
            document.getElementById('host-id-display').value = state.myId;
            
            // Copy ID Button
            document.getElementById('copy-id-btn').onclick = () => {
                document.getElementById('host-id-display').select();
                document.execCommand('copy');
                showToast('success', 'Copied', 'ID copied to clipboard');
            };

            openModal('qr');
        }

        function openModal(type) {
            dom.modal.overlay.classList.remove('opacity-0', 'pointer-events-none');
            dom.modal[type].classList.remove('hidden');
            setTimeout(() => {
                dom.modal[type].classList.remove('scale-95');
                dom.modal[type].classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            dom.modal.overlay.classList.add('opacity-0', 'pointer-events-none');
            Object.values(dom.modal).forEach(el => {
                if(el !== dom.modal.overlay) {
                    el.classList.add('scale-95');
                    el.classList.remove('scale-100');
                    setTimeout(() => el.classList.add('hidden'), 300);
                }
            });
        }

        function showToast(type, title, msg) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const titleEl = document.getElementById('toast-title');
            const msgEl = document.getElementById('toast-msg');

            icon.className = type === 'success' ? 'fa-solid fa-check text-emerald-400' : 
                             type === 'error' ? 'fa-solid fa-triangle-exclamation text-red-400' : 'fa-solid fa-bell text-indigo-400';
            
            titleEl.innerText = title;
            msgEl.innerText = msg;

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        // --- Helpers ---

        function setStatus(type, msg) {
            dom.statusText.innerText = msg;
            dom.statusDot.className = `w-1.5 h-1.5 rounded-full ${
                type === 'active' ? 'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.5)]' :
                type === 'error' ? 'bg-red-500' : 'bg-yellow-500 animate-pulse'
            }`;
        }

        function updatePeerCount() {
            const count = state.conns.length + 1;
            dom.peerCount.innerHTML = `<i class="fa-solid fa-user-group mr-1"></i> ${count} Device${count !== 1 ? 's' : ''}`;
        }

        function updateTextStats() {
            const len = dom.text.value.length;
            dom.charCount.innerText = `${len} char${len !== 1 ? 's' : ''}`;
        }

        function highlightUpdate() {
            dom.lastSync.innerText = "Synced: Just now";
            dom.lastSync.classList.add('text-emerald-400');
            setTimeout(() => dom.lastSync.classList.remove('text-emerald-400'), 1000);
        }

        function updateUrl(id) {
            try {
                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?host=' + id;
                window.history.replaceState({ path: newUrl }, '', newUrl);
            } catch(e) {}
        }

        function formatBytes(bytes, decimals = 2) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        init();
    </script>
</body>
</html>
